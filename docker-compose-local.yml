version: "3.8"

services:
  nginx:
    image: nginx:1.25
    ports:
      - "81:81"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - spring-api

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
#      MYSQL_USER: demo
#      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  spring-api:
    image: spring-api
    container_name: spring-api
#    ports:
#      - "8080:8080"
    expose:
      - "8080"
    build: .
    env_file: 
      - .env
    depends_on:
      - redis
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
