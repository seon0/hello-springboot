version: "3.8"

services:
  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certbot:/var/www/certbot
      - ./nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      - spring-api

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot:/var/www/certbot
      - ./nginx/letsencrypt:/etc/letsencrypt

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root 
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    command:
      --innodb-buffer-pool-size=128M
    volumes:
      - mysql-data:/var/lib/mysql

  spring-api:
    image: spring-api
    container_name: spring-api
#    ports:
#      - "8080:8080"
    expose:
      - "8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
    build: .
    env_file: 
      - .env
    depends_on:
      - redis
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:

logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
